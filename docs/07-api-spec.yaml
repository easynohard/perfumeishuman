# 7단계 §5 — OpenAPI 명세. 기준: docs/07-api-spec.md §4 (자동 생성 스크립트 산출물이 아니라 이 파일이 원본이다)
openapi: 3.0.3
info:
  title: perfumeishuman API
  version: 1.0.0-draft
  contact:
    name: perfumeishuman 운영
  description: '향수가 사람이라면? — API 명세. 기준 문서: docs/07-api-spec.md (§4). 필드는 snake_case, 시각은 ISO 8601(+09:00). 소프트 삭제된 시향기는 /admin 외 모든 응답에서 404·제외.
    쓰기 요청(POST·PATCH·PUT·DELETE)은 CSRF 검증을 거치며 실패 시 403 CSRF_INVALID. 에러 코드 전체는 §4.5.'
servers:
- url: /api/v1
tags:
- name: catalog
- name: reviews
- name: users
- name: policies
- name: auth
- name: me
- name: write-helpers
- name: admin
paths:
  /reviews:
    get:
      summary: 홈 피드 (추천순)
      tags:
      - reviews
      operationId: get_reviews
      parameters:
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - recommend
          default: recommend
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageReviewCard'
        '400':
          description: Bad Request — INVALID_PARAMETER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_PARAMETER
                  message: 오류 메시지
      security:
      - {}
      - sessionCookie: []
      description: 홈 피드 (추천순)
    post:
      summary: 시향기 등록
      tags:
      - reviews
      operationId: post_reviews
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
      responses:
        '201':
          description: 'Location: /api/v1/reviews/{slug}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetail'
        '400':
          description: Bad Request — TEXT_REQUIRED, TEXT_TOO_LONG, TAG_REQUIRED, TAG_TOO_MANY, TAG_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: TEXT_REQUIRED
                  message: 오류 메시지
        '404':
          description: Not Found — PERFUME_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: PERFUME_NOT_FOUND
                  message: 오류 메시지
        '409':
          description: Conflict — ALREADY_REVIEWED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ALREADY_REVIEWED
                  message: 오류 메시지
        '429':
          description: Too Many Requests — RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: RATE_LIMITED
                  message: 오류 메시지
        '401':
          description: Unauthorized — LOGIN_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: LOGIN_REQUIRED
                  message: 오류 메시지
      security:
      - sessionCookie: []
      description: 시향기 등록
  /brands:
    get:
      summary: 브랜드 전체 목록
