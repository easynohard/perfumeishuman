components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: HttpOnly·Secure·SameSite=Lax 세션 쿠키 (쿠키 이름은 구현 단계에서 확정)
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        default: 10
      description: 기본 10 (ADR 0018). 상한은 구현 단계.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: k3f9a2x1
            message:
              type: string
              example: 오류 메시지
            fields:
              type: object
              additionalProperties:
                type: string
          required:
          - code
          - message
      required:
      - error
    Image:
      type: object
      properties:
        url:
          type: string
          example: https://example.com/img/o-rose.png
        alt:
          type: string
          example: 오 로즈 향수 병
      required:
      - url
      - alt
      description: null이면 화면이 텍스트 카드로 폴백한다. 이미지 없음·권리 상태 비정상·브랜드 일괄 비공개면 서버가 null.
      nullable: true
    BrandRef:
      type: object
      properties:
        slug:
          type: string
          example: 8f3k2a1x
        name:
          type: string
          example: 오 로즈
      required:
      - slug
      - name
    AccordRef:
      type: object
      properties:
        slug:
          type: string
          example: 8f3k2a1x
        name:
          type: string
          example: 오 로즈
      required:
      - slug
      - name
    PerfumeRef:
      type: object
      properties:
        slug:
          type: string
          example: 8f3k2a1x
        name:
          type: string
          example: 오 로즈
        brand:
          $ref: '#/components/schemas/BrandRef'
        image:
